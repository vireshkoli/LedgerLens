name: CI

# Every push on every branch: a pushed branch is already public, so a pull request is too late.
on:
  push:

permissions:
  contents: read

# A newer push may cancel an older run, and nothing slips through that way, because the
# forbidden-file and secret checks read the whole history every time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: 3.14.10
  UV_VERSION: 0.13.7
  NODE_VERSION: 26.13.0
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  forbidden-files:
    name: Forbidden files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Check every version of every file
        run: uv run --no-project python scripts/check_forbidden_files.py --history

  secrets:
    name: Secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks
      - name: Scan the whole history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner .'

  quality:
    name: Lint, types and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: |
          uv sync --locked
          npm --prefix web ci --no-fund --no-audit
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Lint and types
        run: make lint
        env:
          # This hook reads staged changes only, so here it would pass without reading anything.
          # The secrets job does the real scan.
          SKIP: gitleaks
      - name: Unit and integration tests
        run: make test

  stack:
    name: Stack on amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Build the images and start the stack
        run: make up
      - name: Check the images are amd64
        run: |
          for image in ledgerlens-api ledgerlens-web; do
            architecture="$(docker image inspect "$image" --format '{{.Architecture}}')"
            echo "$image: $architecture"
            test "$architecture" = amd64
          done
      - name: Test the running stack
        run: make test-stack
      - name: Show the stack's logs
        if: failure()
        run: docker compose --env-file .env --file deploy/compose.yaml logs --no-color

  eval-smoke:
    name: eval-smoke (stub, checks nothing until V1-24)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Say that nothing was checked
        run: echo "::notice title=eval-smoke stub::No metrics are checked until V1-24 adds the replay suite."
